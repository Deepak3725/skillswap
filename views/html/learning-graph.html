<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Network · SkillSwap</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body data-page="graph" data-auth="pending">
  <main class="content" id="content">
    <div class="page-header">
      <div>
        <h1>My learning network</h1>
        <p>The people you've swapped skills with, and the people they've swapped with.</p>
      </div>
      <button type="button" class="btn btn-light" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i>Refresh</button>
    </div>

    <div class="net-toolbar mb-3">
      <span class="net-toolbar-label"><i class="bi bi-binoculars"></i>Show people</span>
      <div class="filter-pills" id="depthFilter" role="group" aria-label="How far to explore your network">
        <button type="button" data-depth="1">Direct partners</button>
        <button type="button" data-depth="2">Up to 2 swaps away</button>
        <button type="button" data-depth="3">Up to 3 swaps away</button>
        <button type="button" data-depth="all">Everyone reachable</button>
      </div>
    </div>

    <section class="net-summary mb-4" id="netSummary" aria-live="polite"></section>

    <div class="row g-4">
      <div class="col-xl-8">
        <section class="card net-card">
          <div class="card-header">
            <div class="d-flex align-items-center gap-2"><span class="card-title-icon"><i class="bi bi-diagram-3"></i></span>
              <div><h2>Network map</h2><div class="hint" id="netHint">Select a person to see what you exchanged</div></div></div>
            <button type="button" class="btn btn-light btn-sm" id="resetBtn" hidden><i class="bi bi-arrow-counterclockwise"></i>Back to network</button>
          </div>
          <div class="net-legend" id="netLegend">
            <span><i class="lg lg-teach"></i>You teach them</span>
            <span><i class="lg lg-learn"></i>You learn from them</span>
            <span><i class="lg lg-other"></i>Swap between others</span>
            <span><i class="lg lg-route"></i>Connection route</span>
          </div>
          <div class="net-canvas" id="netCanvas"></div>
        </section>
      </div>

      <div class="col-xl-4">
        <aside class="card net-panel" id="netPanel" aria-live="polite"></aside>
      </div>
    </div>

    <section class="mt-4" id="netLists"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/learning-graph.js"></script>
</body>
</html>
