<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · SkillSwap</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body data-page="notifications" data-auth="pending">
  <main class="content" id="content" style="max-width:920px">
    <div class="page-header">
      <div>
        <h1>Notifications</h1>
        <p id="unreadSummary">Updates about your swap requests.</p>
      </div>
      <button type="button" class="btn btn-light" id="readAllBtn" disabled><i class="bi bi-check2-all"></i>Mark all as read</button>
    </div>

    <div class="seg mb-3" role="tablist" aria-label="Filter notifications">
      <button type="button" role="tab" data-filter="all" class="active">All <span class="count" data-filter-count="all">0</span></button>
      <button type="button" role="tab" data-filter="unread">Unread <span class="count" data-filter-count="unread">0</span></button>
    </div>

    <div class="card" id="notifList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
