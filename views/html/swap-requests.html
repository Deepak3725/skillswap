<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swap Requests · SkillSwap</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body data-page="requests" data-auth="pending">
  <main class="content" id="content">
    <div class="page-header">
      <div>
        <h1>Swap requests</h1>
        <p>Respond to incoming requests and track the ones you've sent.</p>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i>Refresh</button>
        <a class="btn btn-primary" href="/search.html"><i class="bi bi-plus-lg"></i>New request</a>
      </div>
    </div>

    <div id="queueSpotlight" class="mb-4"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div class="seg" role="tablist" aria-label="Request direction">
        <button type="button" role="tab" data-tab="received" class="active"><i class="bi bi-inbox"></i>Received <span class="count" data-tab-count="received">0</span></button>
        <button type="button" role="tab" data-tab="sent"><i class="bi bi-send"></i>Sent <span class="count" data-tab-count="sent">0</span></button>
      </div>
      <div class="filter-pills" id="statusFilter" role="group" aria-label="Filter by status">
        <button type="button" data-status="ALL" class="active">All</button>
        <button type="button" data-status="PENDING">Pending</button>
        <button type="button" data-status="ACCEPTED">Accepted</button>
        <button type="button" data-status="COMPLETED">Completed</button>
        <button type="button" data-status="REJECTED">Rejected</button>
        <button type="button" data-status="CANCELLED">Cancelled</button>
      </div>
    </div>

    <div id="requestList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/swap-requests.js"></script>
</body>
</html>
