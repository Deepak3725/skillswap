<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SkillSwap — exchange skills and learn from your peers.">
  <title>Log in · SkillSwap</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-aside">
      <a class="brand" href="/index.html"><span class="brand-mark"><i class="bi bi-arrow-left-right"></i></span>SkillSwap</a>

      <div class="auth-hero">
        <h1>Share what you know.<br><span class="accent">Learn what you love.</span></h1>
        <p class="auth-hero-lead">Connect with people, exchange skills, and grow together, one skill at a time.</p>
      </div>

      <p class="small mb-0" style="color:#6d80b5">Peer learning platform · Data Structures &amp; Algorithms project</p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a class="brand dark auth-mobile-brand" href="/index.html"><span class="brand-mark"><i class="bi bi-arrow-left-right"></i></span>SkillSwap</a>

        <h2>Welcome back</h2>
        <p class="text-secondary mb-4">Log in to continue swapping skills.</p>

        <div id="loginAlert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <div class="input-icon">
              <i class="bi bi-envelope"></i>
              <input class="form-control" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" maxlength="150" required>
            </div>
            <div class="invalid-feedback d-block" data-error-for="email"></div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="input-icon">
              <i class="bi bi-lock"></i>
              <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" class="input-action" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="invalid-feedback d-block" data-error-for="password"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" id="loginButton"><i class="bi bi-box-arrow-in-right"></i>Log in</button>
        </form>

        <div class="auth-divider">New to SkillSwap?</div>
        <a class="btn btn-light w-100" href="/signup.html"><i class="bi bi-person-plus"></i>Create an account</a>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
