# Runs SkillSwap + a fresh PostgreSQL database with the schema applied.
# Usage:  copy .env.example to .env, set DB_PASSWORD, then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: ${DB_USER:-skillswap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Thimphu}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skillswap} -d skillswap"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/skillswap
      DB_USER: ${DB_USER:-skillswap}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Thimphu}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
